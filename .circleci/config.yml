# Replaces the config CircleCI generated for this repo, which ran on cimg/node:lts.
# lts moved to Node 26, where mocha 8 fails to start. Pin the Node version magpie uses.
version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:22.23.4

jobs:
  test-node:
    executor: node
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm install --no-audit --no-fund
      - run:
          name: Run tests
          command: npm test

  build-node:
    executor: node
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm install --no-audit --no-fund
      - run:
          name: Build
          command: npm run build

workflows:
  build-and-test:
    jobs:
      - test-node
      - build-node:
          requires:
            - test-node
